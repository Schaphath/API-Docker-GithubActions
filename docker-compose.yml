services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - db-net

  api:
    build:
      context: .
      dockerfile: ./Api/Dockerfile
    image: oncoscan-api:${VERSION:-latest}
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:?API_KEY must be set}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MODEL_PATH: /app/save_models/decision_tree_best.pkl
      SCALER_PATH: /app/save_models/MinMax_scaler.pkl
    volumes:
      - ./Save_models:/app/save_models:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal-net

  interface:
    build:
      context: .
      dockerfile: ./Interface/Dockerfile
    image: oncoscan-interface:${VERSION:-latest}
    restart: unless-stopped
    environment:
      API_URL: http://api:8000/predict
      API_KEY: ${API_KEY:?API_KEY must be set}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?DB_NAME must be set}
      DB_USER: ${DB_USER:?DB_USER must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_GATHER_USAGE_STATS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    networks:
      - internal-net
      - db-net

volumes:
  pgdata:

networks:
  internal-net:
    driver: bridge
  db-net:
    driver: bridge